<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NITSHACKS 9.0 — Team uppu Pitch Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      background: #0d1322;
      border-bottom: 1px solid #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: #ef4444;
      color: #fff;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      color: #f8fafc;
    }
    .team {
      font-size: 13px;
      color: #0ea5e9;
      font-weight: 600;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: #0ea5e9;
      color: #04121d;
    }
    .btn-primary:hover {
      background: #38bdf8;
    }
    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border-color: #334155;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .deck-container {
      flex: 1;
      width: 100%;
      max-width: 1280px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .slide-viewer {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.7), 0 0 0 1px #1e293b;
      position: relative;
    }
    .slide-viewer img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .nav-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 4px;
    }
    .nav-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn:hover:not(:disabled) {
      background: #334155;
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .slide-counter {
      font-size: 15px;
      font-weight: 600;
      color: #94a3b8;
    }
    .thumbs {
      display: flex;
      gap: 10px;
      width: 100%;
      overflow-x: auto;
      padding: 8px 4px 16px 4px;
      justify-content: center;
    }
    .thumb {
      width: 140px;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid #1e293b;
      opacity: 0.6;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .thumb:hover {
      opacity: 0.9;
    }
    .thumb.active {
      border-color: #0ea5e9;
      opacity: 1;
      box-shadow: 0 0 12px rgba(14, 165, 233, 0.4);
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="badge">NITSHACKS 9.0</span>
      <span class="title">J.A.R.V.I.S. Pitch Deck</span>
      <span class="team">• Team uppu (Kaustab Karmakar & Rajat Sharma)</span>
    </div>
    <div class="actions">
      <a class="btn btn-secondary" href="/NITSHACKS_9_UPPU_JARVIS.pptx" download>
        ⬇ Download PPTX
      </a>
      <a class="btn btn-primary" href="/NITSHACKS_9_UPPU_JARVIS.pdf" target="_blank" download>
        ⬇ Download PDF (Ready to Submit)
      </a>
      <a class="btn btn-secondary" href="/" target="_blank">
        ⚡ Live HUD Dashboard
      </a>
    </div>
  </header>

  <div class="deck-container">
    <div class="slide-viewer">
      <img id="current-slide" src="/slides/Slide1.PNG" alt="Slide Preview" />
    </div>

    <div class="nav-bar">
      <button class="nav-btn" id="prev-btn" onclick="prevSlide()">◀ Previous</button>
      <span class="slide-counter" id="slide-num">Slide 1 of 6</span>
      <button class="nav-btn" id="next-btn" onclick="nextSlide()">Next ▶</button>
    </div>

    <div class="thumbs">
      <div class="thumb active" onclick="goToSlide(1)"><img src="/slides/Slide1.PNG" alt="1" /></div>
      <div class="thumb" onclick="goToSlide(2)"><img src="/slides/Slide2.PNG" alt="2" /></div>
      <div class="thumb" onclick="goToSlide(3)"><img src="/slides/Slide3.PNG" alt="3" /></div>
      <div class="thumb" onclick="goToSlide(4)"><img src="/slides/Slide4.PNG" alt="4" /></div>
      <div class="thumb" onclick="goToSlide(5)"><img src="/slides/Slide5.PNG" alt="5" /></div>
      <div class="thumb" onclick="goToSlide(6)"><img src="/slides/Slide6.PNG" alt="6" /></div>
    </div>
  </div>

  <script>
    let current = 1;
    const total = 6;
    const slideImg = document.getElementById('current-slide');
    const slideNum = document.getElementById('slide-num');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const thumbs = document.querySelectorAll('.thumb');

    function update() {
      slideImg.src = `/slides/Slide${current}.PNG`;
      slideNum.textContent = `Slide ${current} of ${total}`;
      prevBtn.disabled = current === 1;
      nextBtn.disabled = current === total;
      thumbs.forEach((t, idx) => {
        if (idx + 1 === current) {
          t.classList.add('active');
        } else {
          t.classList.remove('active');
        }
      });
    }

    function prevSlide() {
      if (current > 1) { current--; update(); }
    }
    function nextSlide() {
      if (current < total) { current++; update(); }
    }
    function goToSlide(n) {
      current = n;
      update();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
    });

    update();
  </script>

</body>
</html>
